name: Hospital RL – MLOps CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint & Test ────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint (flake8)
        run: flake8 sim/ train.py evaluate.py --max-line-length=200 --ignore=E501,W503,E302,E303,W291,W293

      - name: Run unit tests
        run: pytest tests/ -v

  # ── 2. Train ─────────────────────────────────────────────────────────────
  train:
    name: Train RL Agent
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p models experiments reports

      - name: Train Q-Learning agent (v1 config)
        run: python train.py --config configs/qlearning_v1.yaml

      - name: Upload trained policy
        uses: actions/upload-artifact@v4
        with:
          name: trained-policy
          path: models/

      - name: Upload experiment logs
        uses: actions/upload-artifact@v4
        with:
          name: experiment-logs
          path: experiments/

  # ── 3. Evaluate ──────────────────────────────────────────────────────────
  evaluate:
    name: Evaluate & Compare
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download trained policy
        uses: actions/download-artifact@v4
        with:
          name: trained-policy
          path: models/

      - name: Run evaluation
        run: python evaluate.py --policy models/policy_best.pkl --episodes 30

      - name: Upload reports and plots
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: reports/

  # ── 4. Docker Build ───────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: evaluate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download trained policy
        uses: actions/download-artifact@v4
        with:
          name: trained-policy
          path: models/

      - name: Build Docker image
        run: |
          docker build -t hospital-rl-api:latest .
          docker tag hospital-rl-api:latest hospital-rl-api:${{ github.sha }}

      - name: Test Docker container
        run: |
          docker run -d --name test-api -p 8000:8000 hospital-rl-api:latest
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop test-api
