# ─────────────────────────────────────────────
# Hospital Resource Allocation – RL Config v2
# More episodes, slower decay (more exploration)
# Run: python train.py --config configs/qlearning_v2.yaml
# ─────────────────────────────────────────────

run_id: "qlearning-v2-explored"
seed: 7

env:
  episode_length: 100

agent:
  algorithm: "Q-Learning"
  alpha: 0.15                # slightly higher LR
  gamma: 0.99                # longer horizon
  epsilon: 1.0
  epsilon_min: 0.02
  epsilon_decay: 0.99        # slower decay = more exploration

training:
  n_episodes: 500
  log_every: 20
  save_checkpoints: [200, 400]
